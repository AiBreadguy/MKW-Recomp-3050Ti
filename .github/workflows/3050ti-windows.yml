name: 3050 Ti Windows development build

# Full portable Windows package from the source branch, not just mkw.exe.
# Build only the runtime/launcher and setup tools. No game files, keys or generated game code.
on:
  push:
    branches:
      - dev/3050ti-baseline
      - perf/3050ti-pool-headroom
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 3050ti-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container: archlinux:latest
    steps:
      - name: Build dependencies
        run: pacman -Syu --noconfirm --needed git ccache ninja cmake binutils uv python
      - uses: actions/checkout@v7
      - name: Trust checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v6
        with:
          path: build/win
          key: 3050ti-windeps-${{ hashFiles('tools/build/windeps.py') }}
      - uses: actions/cache@v6
        with:
          path: build/dist/dl
          key: 3050ti-dist-windows-${{ hashFiles('tools/build/dist.py') }}
      - name: Check isolated C regression tests
        run: uv run pytest tests/test_defaults.py tests/test_dcache_hash.py -q
      - name: Fetch and verify Windows toolchain and libraries
        run: uv run tools/build/windeps.py
      - name: Compile Windows runtime and launcher (no game data)
        run: uv run tools/build/build.py --target windows --dist --runtime-only
      - name: Bundle all setup tools and Windows DLLs
        run: uv run tools/build/dist.py --target windows
      - name: Create portable Windows ZIP
        shell: bash
        run: |
          set -euo pipefail
          version="0.1.12-3050ti-${GITHUB_SHA:0:7}"
          uv run tools/build/release.py --target windows --version "$version"
          ls -lh build/release/*-windows-x64.zip
      - name: Publish complete portable ZIP as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: MKW-Recomp-3050Ti-Windows
          path: build/release/*-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  # Smoke-check the actual portable package on a Windows runner (no Nintendo game files).
  # The GitHub-hosted runner may lack Vulkan: that prevents a native launch check but does
  # not indicate the package is broken for a laptop with the NVIDIA Vulkan driver installed.
  windows-smoke:
    needs: windows-portable
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: MKW-Recomp-3050Ti-Windows
          path: windows-artifact
      - name: Inspect portable ZIP and run game-free ABI probe if possible
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Path windows-artifact -Filter "*-windows-x64.zip" -File | Select-Object -First 1
          if (-not $pkg) { throw "No Windows portable package downloaded" }
          Expand-Archive -LiteralPath $pkg.FullName -DestinationPath extracted
          $exe = (Resolve-Path -LiteralPath "extracted/mkw-recomp/mkw.exe").Path
          $updater = "extracted/mkw-recomp/setup/src/tools/prepare/update.py"
          if (-not (Test-Path -LiteralPath "extracted/mkw-recomp/SDL3.dll")) { throw "SDL3.dll missing" }
          if (-not (Test-Path -LiteralPath $updater)) { throw "Packaged updater missing" }
          if (-not (Select-String -LiteralPath $updater -SimpleMatch "AiBreadguy/MKW-Recomp-3050Ti")) {
              throw "Incorrect updater: would offer upstream builds"
          }
          if (-not (Test-Path -LiteralPath "$env:WINDIR/System32/vulkan-1.dll")) {
              Write-Warning "Hosted runner lacks Vulkan loader; native ABI probe skipped. Windows package structure passed."
              exit 0
          }
          & $exe --probe-gfx-abi
          if ($LASTEXITCODE -ne 0) { throw "Windows runtime ABI probe failed with exit code $LASTEXITCODE" }
